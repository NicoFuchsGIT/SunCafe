name: Update Wien Daten
on:
  schedule:
    - cron: '0 3 1,15 * *' # Jeden 1. und 15. im Monat um 03:00 Uhr
  workflow_dispatch: # Erlaubt dir, das Update auf GitHub auch manuell per Knopfdruck zu starten

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Overpass Daten für Wien abrufen
        run: |
            mkdir -p data
            # Wir nutzen den schnelleren LZ4-Mirror und einen extrem stabilen 5km Radius
            curl -g -X POST "https://lz4.overpass-api.de/api/interpreter" \
            -H "User-Agent: SunCafe-Bot/1.0 (https://github.com/nicofu2510/SunCafe)" \
            -H "Accept: application/json" \
            --data-urlencode 'data=[out:json][timeout:300];(nwr["amenity"~"cafe|bar|pub|restaurant"](around:5000,48.2082,16.3738);nwr["shop"="bakery"](around:5000,48.2082,16.3738);nwr["leisure"="outdoor_seating"](around:5000,48.2082,16.3738););out body center;' \
            -o data/wien.json

      - name: JSON auf Gültigkeit prüfen (Schutz vor kaputten Dateien)
        run: |
          # 'jq empty' prüft, ob die Datei echtes JSON ist. Wenn es XML ist, bricht das Skript hier ab!
          jq empty data/wien.json