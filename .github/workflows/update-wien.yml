name: Update Wien Daten

on:
  schedule:
    - cron: '0 3 1,15 * *' # am 1. und 15. jedes Monats um 03:00 UTC
  workflow_dispatch: # manuell startbar im Reiter "Actions"

permissions:
  contents: write # nötig, damit der Workflow die Datei ins Repo zurückschreiben darf

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Overpass-Daten für Wien abrufen
        run: |
          mkdir -p data
          UA="SunCafe-Bot/1.0 (https://github.com/NicoFuchsGIT/SunCafe)"
          SERVERS="https://overpass-api.de/api/interpreter https://lz4.overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://overpass.kumi.systems/api/interpreter"
          # Rechteck statt Umkreis: für Overpass viel billiger. Deckt 6 km um den Stephansplatz ab.
          B='(48.154,16.293,48.262,16.455)'

          # Fragt alle Server reihum, bis eine gültige Antwort kommt (3 Runden).
          # Gültig = echtes JSON, keine Overpass-Fehlermeldung ("remark"), genug Elemente.
          fetch() { # $1 Query, $2 Ausgabedatei, $3 Mindestanzahl Elemente
            for round in 1 2 3; do
              for url in $SERVERS; do
                echo "Runde $round: $url"
                if curl -sS -f -m 240 -X POST "$url" -H "User-Agent: $UA" --data-urlencode "data=$1" -o "$2" \
                   && jq -e --argjson n "$3" '(.remark // "") == "" and (.elements | length) > $n' "$2" > /dev/null 2>&1; then
                  echo "OK: $(jq '.elements | length' "$2") Elemente"
                  return 0
                fi
                sleep 5
              done
              sleep 30
            done
            return 1
          }

          fetch "[out:json][timeout:120];(nwr[\"amenity\"=\"cafe\"]$B;nwr[\"shop\"=\"bakery\"]$B;);out body center;" /tmp/a.json 300 || { echo "Cafés konnten nicht geladen werden"; exit 1; }
          fetch "[out:json][timeout:120];(nwr[\"leisure\"=\"outdoor_seating\"]$B;);out body center;" /tmp/t.json 20 || { echo "Terrassen konnten nicht geladen werden"; exit 1; }
          fetch "[out:json][timeout:120];(nwr[\"amenity\"~\"^(bar|pub|restaurant)$\"]$B;);out body center;" /tmp/b.json 300 || { echo "Bars/Restaurants konnten nicht geladen werden"; exit 1; }

          # Zusammenführen und auf die Felder kürzen, die die App braucht (spart rund 70 % Größe)
          jq -c -s '{elements: [ (.[0].elements + .[1].elements + .[2].elements | unique_by([.type, .id]))[]
              | {type, id, lat, lon, center,
                 tags: ((.tags // {}) | {name: .name, amenity: .amenity, shop: .shop, leisure: .leisure,
                        opening_hours: .opening_hours, outdoor_seating: .outdoor_seating,
                        "addr:street": .["addr:street"], "addr:housenumber": .["addr:housenumber"]}
                        | with_entries(select(.value != null)))}
              | with_entries(select(.value != null)) ]}' /tmp/a.json /tmp/t.json /tmp/b.json > /tmp/out.json

          jq -e '.elements | length > 1000' /tmp/out.json > /dev/null || { echo "Ergebnis zu klein, Datei wird nicht überschrieben"; exit 1; }
          # Vergleich mit der bisherigen Datei: deutlich weniger Einträge deuten auf einen unvollständigen Abruf hin
          if [ -f data/wien.json ]; then
            old=$(jq '.elements | length' data/wien.json 2>/dev/null || echo 0)
            new=$(jq '.elements | length' /tmp/out.json)
            echo "Bisher: $old Einträge, neu: $new Einträge"
            if [ "${old:-0}" -gt 0 ] && [ "$new" -lt $((old * 7 / 10)) ]; then
              echo "Neue Datei hat weniger als 70 % der bisherigen Einträge, alte Datei bleibt bestehen"
              exit 1
            fi
          fi
          mv /tmp/out.json data/wien.json
          ls -l data/wien.json

      - name: Datei ins Repo schreiben (nur bei Änderungen)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wien.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen"
          else
            git commit -m "Wien-Daten aktualisiert"
            git push
          fi
  # Phase 2.7: Horizontmasken neu rechnen; schlägt ein Plausibilitätscheck fehl, bleiben die alten Kacheln im Repo.
  # Einzeln wiederholbar über "Re-run failed jobs", ohne die Orte neu zu laden.
  horizon:
    needs: update-data
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Repository auschecken (inkl. frisch aktualisierter wien.json)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Pipeline ausführen
        run: python3 pipeline/points.py --out data/horizon > /dev/null

      - name: Kacheln ins Repo schreiben (nur bei Änderungen)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/horizon
          if git diff --cached --quiet; then
            echo "Keine Änderungen"
          else
            git commit -m "Horizontmasken Wien aktualisiert"
            git pull --rebase
            git push
          fi
