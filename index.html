<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>SunCafe – Finde Sonnenplätze</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
<div id="app">
    <aside id="side">
        <header>
            <h1>☀️ SunCafe</h1>
            <div id="wx">Wetter wird geladen …</div>
            <div class="row">
                <input id="q" type="search" placeholder="Adresse suchen, Enter drücken" aria-label="Adresse suchen">
            </div>
        </header>
        <div id="time">
            <div id="tl"><span id="tlabel">Jetzt</span><small id="sunstate"></small></div>
            <input id="slider" type="range" min="0" max="96" value="0" aria-label="Uhrzeit, bis 48 Stunden voraus">
        </div>
        <div id="filters">
            <label><input type="checkbox" id="fopen"> Geöffnet</label>
            <label><input type="checkbox" id="fsun"> Nur Sonne</label>
        </div>
        <div id="status">Karte antippen oder Adresse suchen, um Cafés zu laden.</div>
        <ul id="list"></ul>
    </aside>
    <div id="map"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>window.maplibregl||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"><\/script>')</script>
<script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.js"></script>
<script src="https://cdn.jsdelivr.net/npm/i18next@21.10.0/dist/umd/i18next.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/opening_hours@3.8.0/build/opening_hours.js"></script>
<script src="js/app.js?v=2"></script>
</body>
</html>
