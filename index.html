<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SunCafe - Finde Sonnenplätze</title>

    <!-- Mapbox GL JS CSS & JavaScript -->
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
        }

        /* Kopfbereich */
        #header {
            padding: 20px;
            text-align: center;
            z-index: 10;
        }
        h1 { margin: 0 0 10px 0; color: #333; }

        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background-color: #f39c12;
            color: white;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        #status { margin-top: 10px; font-weight: 500; color: #2c3e50; }

        /* Der Container für die Karte */
        #map {
            flex-grow: 1; /* Nimmt den restlichen Platz ein */
            width: 100%;
            display: none; /* Erst zeigen, wenn der Standort da ist */
        }
    </style>
</head>
<body>

    <div id="header">
        <h1>☀️ SunCafe</h1>
        <button id="locate-btn">📍 Meinen Standort abfragen</button>
        <p id="status"></p>
    </div>

    <!-- Hier wird Mapbox die Karte rendern -->
    <div id="map"></div>

    <script>
        // DEIN MAPBOX TOKEN HIER EINFÜGEN
        mapboxgl.accessToken = 'Mapbox Token';

        const locateBtn = document.getElementById('locate-btn');
        const statusText = document.getElementById('status');
        const mapContainer = document.getElementById('map');
        let map; // Globale Variable für die Karte

        locateBtn.addEventListener('click', () => {
            if (!navigator.geolocation) {
                statusText.textContent = "Geolokalisierung wird nicht unterstützt.";
                return;
            }

            statusText.textContent = "Standort wird ermittelt...";

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;

                    // UI aktualisieren
                    statusText.textContent = "Standort gefunden! Lade Karte...";
                    locateBtn.style.display = 'none'; // Button verstecken
                    mapContainer.style.display = 'block'; // Karten-Container sichtbar machen

                    // Mapbox Karte initialisieren
                    map = new mapboxgl.Map({
                        container: 'map', // ID des HTML-Elements
                        style: 'mapbox://styles/mapbox/streets-v12', // Karten-Design
                        center: [lon, lat], // Start-Koordinaten [Längengrad, Breitengrad]!
                        zoom: 14 // Zoom-Level (14 ist gut für Stadtteile)
                    });

                    // Einen Marker an der eigenen Position setzen
                    new mapboxgl.Marker({ color: '#e74c3c' })
                        .setLngLat([lon, lat])
                        .addTo(map);

                    // Status Text nach kurzem Delay entfernen, damit man nur die Karte sieht
                    setTimeout(() => {
                        statusText.style.display = 'none';
                    }, 2000);
                },
                (error) => {
                    console.error("Fehler bei der Ortung:", error);
                    statusText.textContent = "Fehler bei der Standortabfrage. Bitte Berechtigung prüfen.";
                }
            );
        });
    </script>
</body>
</html>
