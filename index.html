<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SunCafe - Finde Sonnenplätze</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 5px;
        }
        p {
            color: #666;
            margin-bottom: 20px;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background-color: #f39c12; /* Ein sonniges Orange/Gelb */
            color: white;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #e67e22;
        }
        #status {
            margin-top: 20px;
            font-size: 16px;
            font-weight: 500;
            color: #2c3e50;
        }
    </style>
</head>
<body>

    <h1>☀️ SunCafe</h1>
    <p>Finde Cafés in der Sonne (2km Umkreis)</p>

    <button id="locate-btn">📍 Meinen Standort abfragen</button>
    <p id="status"></p>

    <script>
        // HTML-Elemente abgreifen
        const locateBtn = document.getElementById('locate-btn');
        const statusText = document.getElementById('status');

        // Klick-Event für den Button
        locateBtn.addEventListener('click', () => {
            // Prüfen, ob der Browser Geolocation unterstützt
            if (!navigator.geolocation) {
                statusText.textContent = "Geolokalisierung wird von deinem Browser leider nicht unterstützt.";
                return;
            }

            statusText.textContent = "Standort wird ermittelt...";

            // API aufrufen
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    // Erfolgsfall: Koordinaten auslesen
                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;

                    // Auf der Seite anzeigen
                    statusText.textContent = `Standort gefunden! (${latitude.toFixed(4)}, ${longitude.toFixed(4)})`;

                    // In der Konsole loggen
                    console.log("Erfolgreich geortet!");
                    console.log("Breitengrad (Latitude):", latitude);
                    console.log("Längengrad (Longitude):", longitude);

                    // TODO für später:
                    // 1. Karte initialisieren und auf diese Koordinaten zentrieren
                    // 2. Google Places API mit diesen Koordinaten aufrufen
                },
                (error) => {
                    // Fehlerbehandlung (z.B. wenn der Nutzer ablehnt)
                    console.error("Fehler bei der Standortabfrage:", error);
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            statusText.textContent = "Standortzugriff wurde verweigert. Bitte erlaube den Zugriff im Browser.";
                            break;
                        case error.POSITION_UNAVAILABLE:
                            statusText.textContent = "Standortinformationen sind nicht verfügbar.";
                            break;
                        case error.TIMEOUT:
                            statusText.textContent = "Die Standortabfrage hat zu lange gedauert (Timeout).";
                            break;
                        default:
                            statusText.textContent = "Ein unbekannter Fehler ist aufgetreten.";
                            break;
                    }
                }
            );
        });
    </script>
</body>
</html>
