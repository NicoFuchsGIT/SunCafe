<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>SunCafe – Finde Sonnenplätze</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="vendor/maplibre-gl.css">
    <link rel="preload" href="fonts/BricolageGrotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-partial" viewBox="0 0 24 24"><path d="M12 2v2M4.9 4.9l1.4 1.4M2 11h2M19.1 4.9l-1.4 1.4M22 11h-2"/><path d="M8 11a4 4 0 0 1 8 0"/><path d="M7 21a4 4 0 0 1-.5-7.97A5.5 5.5 0 0 1 17 14.5h.5a3.25 3.25 0 0 1 0 6.5z"/></symbol>
  <symbol id="i-shade" viewBox="0 0 24 24"><path d="M7 19a4.5 4.5 0 0 1-.5-8.97A6 6 0 0 1 18 11.5h.5a3.75 3.75 0 0 1 0 7.5z"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 22s7-6.4 7-12a7 7 0 1 0-14 0c0 5.6 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></symbol>
  <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h7a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-night" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></symbol>
  <symbol id="i-cafe" viewBox="0 0 24 24"><path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H16.5"/><path d="M8 2v3M12 2v3"/></symbol>
  <symbol id="i-bar" viewBox="0 0 24 24"><path d="M4 4h16l-8 9z"/><path d="M12 13v8M8 21h8"/></symbol>
  <symbol id="i-restaurant" viewBox="0 0 24 24"><path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10"/><path d="M17 21V3c-2.5 1.5-3.5 4.5-3.5 8H17"/></symbol>
  <symbol id="i-filter" viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4.5" cy="6" r=".6"/><circle cx="4.5" cy="12" r=".6"/><circle cx="4.5" cy="18" r=".6"/></symbol>
  <symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></symbol>
</svg>
<div id="app" data-view="map">
    <div id="map"></div>

    <div id="topbar">
        <div class="tb-row">
            <input id="q" type="search" enterkeyhint="search" data-i18n-attr="placeholder:search.ph;aria-label:search.label">
            <button id="pick-btn" class="icon-btn" data-i18n-attr="aria-label:pick.title;title:pick.title"><svg class="icon" aria-hidden="true"><use href="#i-pin"/></svg></button>
            <button id="info-btn" class="icon-btn" data-i18n-attr="aria-label:info.btn" aria-haspopup="dialog">i</button>
            <button id="locate-btn" class="icon-btn" data-i18n-attr="aria-label:locate.btn;title:locate.btn"><svg class="icon" aria-hidden="true"><use href="#i-locate"/></svg></button>
        </div>
        <div id="wx" class="pill" data-i18n="wx.loading"></div>
        <div id="notice" class="notice" role="status" hidden>
            <span data-i18n="notice.outside"></span>
            <button id="notice-x" class="icon-btn small" data-i18n-attr="aria-label:notice.close">×</button>
        </div>
    </div>

    <aside id="side" tabindex="-1">
        <header>
            <h1><svg class="icon logo" aria-hidden="true"><use href="#i-sun"/></svg> SunCafe</h1>
            <div id="status" data-i18n="status.hint"></div>
        </header>
        <ul id="list"></ul>
    </aside>

    <section id="sheet" role="dialog" aria-labelledby="sheet-name" tabindex="-1" hidden>
        <button id="sheet-x" class="icon-btn small" data-i18n-attr="aria-label:sheet.close">×</button>
        <div id="sheet-body"></div>
    </section>

    <div id="dock">
        <div id="filters-panel" role="group" aria-labelledby="filters-title" hidden>
            <div class="fp-head"><h2 id="filters-title" data-i18n="filter.title"></h2><button id="filters-x" class="icon-btn small" data-i18n-attr="aria-label:filter.close">×</button></div>
            <label class="check"><input type="checkbox" id="fopen"> <span data-i18n="f.open"></span></label>
            <label class="check"><input type="checkbox" id="fsun"> <span data-i18n="f.sun"></span></label>
            <div class="fp-label" id="cat-label" data-i18n="filter.cat"></div>
            <div id="cats" role="group" aria-labelledby="cat-label">
                <button type="button" class="chip" data-ptype="cafe"><svg class="icon" aria-hidden="true"><use href="#i-cafe"/></svg> <span data-i18n="ptype.cafe.s"></span></button>
                <button type="button" class="chip" data-ptype="bar"><svg class="icon" aria-hidden="true"><use href="#i-bar"/></svg> <span data-i18n="ptype.bar.s"></span></button>
                <button type="button" class="chip" data-ptype="rest"><svg class="icon" aria-hidden="true"><use href="#i-restaurant"/></svg> <span data-i18n="ptype.rest.s"></span></button>
            </div>
            <select id="ptype" hidden data-i18n-attr="aria-label:ptype.label">
                <option value="cafe" data-i18n="ptype.cafe"></option>
                <option value="bar" data-i18n="ptype.bar"></option>
                <option value="rest" data-i18n="ptype.rest"></option>
            </select>
            <label class="fp-label" for="fsort" data-i18n="sort.label"></label>
            <select id="fsort">
                <option value="sun" data-i18n="sort.sun"></option>
                <option value="dist" data-i18n="sort.dist"></option>
            </select>
        </div>
        <div id="tl"><span id="tlabel"></span><span id="preview" class="pill" aria-live="polite" hidden data-i18n="time.preview"></span><small id="sunstate"></small></div>
        <div id="chips" role="group" data-i18n-attr="aria-label:chip.label">
            <button type="button" class="chip" data-chip="now" data-i18n="chip.now"></button>
            <button type="button" class="chip" data-chip="plus1" data-i18n="chip.plus1"></button>
            <button type="button" class="chip" data-chip="evening" data-i18n="chip.evening"></button>
            <button type="button" class="chip" data-chip="morning" data-i18n="chip.morning"></button>
        </div>
        <input id="slider" type="range" min="0" max="96" value="0" data-i18n-attr="aria-label:slider.label">
        <div id="dock-btns">
            <button id="toggle-sidebar" class="btn" aria-expanded="false" aria-controls="side" data-i18n-attr="aria-label:list.open"><svg class="icon" aria-hidden="true"><use id="ts-use" href="#i-list"/></svg> <span id="ts-text" data-i18n="list.btn"></span></button>
            <button id="filter-btn" class="btn" aria-expanded="false" aria-controls="filters-panel"><svg class="icon" aria-hidden="true"><use href="#i-filter"/></svg> <span data-i18n="filter.btn"></span><span id="filter-badge" class="badge" hidden></span></button>
        </div>
    </div>

    <div id="center-marker" class="hidden-ui"><svg class="icon" aria-hidden="true"><use href="#i-pin"/></svg></div>
    <div id="pick-bar" class="hidden-ui">
        <button id="pick-cancel" class="btn" data-i18n="pick.cancel"></button>
        <button id="confirm-place-btn" class="btn primary" data-i18n="pick.confirm"></button>
    </div>
</div>

<dialog id="where" class="modal" aria-labelledby="where-title">
    <div class="info-head"><h2 id="where-title" data-i18n="where.title"></h2><button class="info-x" data-i18n-attr="aria-label:info.close">×</button></div>
    <div class="info-body">
        <p id="where-msg"></p>
        <div class="row">
            <input id="where-q" type="search" enterkeyhint="search" data-i18n-attr="placeholder:search.ph;aria-label:search.label">
            <button id="where-go" class="btn" data-i18n="where.search"></button>
        </div>
        <div class="where-actions">
            <button id="where-retry" class="btn"><svg class="icon" aria-hidden="true"><use href="#i-locate"/></svg> <span data-i18n="where.retry"></span></button>
            <button id="where-pick" class="btn"><svg class="icon" aria-hidden="true"><use href="#i-pin"/></svg> <span data-i18n="where.pick"></span></button>
            <button id="where-center" class="btn" data-i18n="where.center"></button>
        </div>
    </div>
</dialog>

<dialog id="info" class="modal" aria-labelledby="info-title">
    <div class="info-head"><h2 id="info-title" data-i18n="info.title"></h2><button class="info-x" data-i18n-attr="aria-label:info.close">×</button></div>
    <div class="info-body">
        <p><label><span data-i18n="info.lang"></span>: <select id="lang" class="auto"><option value="de">Deutsch</option><option value="en">English</option></select></label></p>
        <p data-i18n="info.intro"></p>

        <h3 data-i18n="info.h.colors"></h3>
        <p><span class="dot sun"></span><span data-i18n="info.sun"></span></p>
        <p><span class="dot shade"></span><span data-i18n="info.shade"></span></p>
        <p><span class="dot night"></span><span data-i18n="info.night"></span></p>
        <p data-i18n="info.partial"></p>
        <p data-i18n="info.minutes"></p>

        <h3 data-i18n="info.h.how"></h3>
        <ul>
            <li data-i18n="info.how2"></li>
            <li data-i18n="info.how3"></li>
            <li data-i18n="info.how4"></li>
        </ul>

        <h3 data-i18n="info.h.limits"></h3>
        <p data-i18n="info.limits"></p>

        <h3 data-i18n="info.h.sources"></h3>
        <ul>
            <li data-i18n-html="info.src.osm"></li>
            <li data-i18n-html="info.src.wien"></li>
            <li data-i18n-html="info.src.dgm"></li>
            <li data-i18n-html="info.src.map"></li>
            <li data-i18n-html="info.src.wx"></li>
            <li data-i18n="info.src.geo"></li>
        </ul>

        <h3 data-i18n="info.h.privacy"></h3>
        <p data-i18n="info.privacy"></p>

        <h3 data-i18n="info.h.code"></h3>
        <p data-i18n-html="info.code"></p>
        <p>Instagram: <a href="https://www.instagram.com/_nicofuchs_/" target="_blank" rel="noopener">https://www.instagram.com/_nicofuchs_/</a></p>
    </div>
</dialog>

<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/suncalc.js"></script>
<script src="vendor/i18next.js"></script>
<script src="vendor/opening_hours.js"></script>
<script type="module" src="js/ui.js"></script>
</body>
</html>
